<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="Width=device-width, initial-scale=1.0">
    <title>Contact Us| Hydra Haven Rafting</title>
    <meta name="description"
      content="Contact Hydra Haven Rafting for the best white water adventures">
    <meta name="author" content="Gabriella Mujinga Ilunga">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="images/logo.png" alt="Hydra Haven Rafting logo">
        </div>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="company-info">
            <h1>Hydra Haven Rafting</h1>
            <p>Lion & Safari Park, R512 Lanseria Road Kalkheuvel, South Africa</p>
            <P>+27 843377000</P>
            <p>info@hydrahavenrafting.com</p>
        </section>


        <section class="contact-layout">
            <div class="map">
                <p><iframe
                      src="https://www.google.com/maps/embed?pb=!1m19!1m8!1m3!1d7182.17297235666!2d27.8895852!3d-25.8336953!3m2!1i1024!2i768!4f13.1!4m8!3e6!4m0!4m5!1s0x1e958139eff6c4b3%3A0x25011fb633919f0a!2sLiquid%20Adventures%20Gauteng%2C%20R512%20Broederstroom%2C%20Hartbeespoort%2C%200216!3m2!1d-25.8336953!2d27.8895852!5e0!3m2!1sen!2sza!4v1770327775466!5m2!1sen!2sza"
                      width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                      referrerpolicy="no-referrer-when-downgrade"></iframe></p>
            </div>

            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="user_name" placeholder="Full Name">

                <label for="email">Email:</label>
                <input type="email" id="email" name="user_email"
                  placeholder="GabriellaIlunga@gmail.com">


                <fieldset>
                    <legend>Message Purpose</legend>
                    <label><input type="radio" name="purpose" value="general"> General
                        Inquiry</label>
                    <label><input type="radio" name="purpose" value="website"> Website
                        Suggestion</label>
                </fieldset>

                <label for="message">Message:</label>
                <textarea id="message" name="user_message"></textarea>

                <label>
                    <input type="checkbox" name="subscribe"> Please subscribe me to the monthly
                    newsletter</label>

                <button type="submit"> Get in Touch!</button>
            </form>
        </section>

        <section class="employees">
            <h2>We Are Here To Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/trip_manager.webp" alt="employee 1">
                    <figcaption><strong>Micheala Williams</strong>
                        -Trip Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/safety_coordinator.jpg" alt="employee 2">
                    <figcaption><strong>John Nebula</strong>
                        -Safety Coordinator</figcaption>
                </figure>

                <figure>
                    <img src="images/senior_tourguide.jpg" alt="employee 3">
                    <figcaption><strong>Peter Petterson</strong>
                        -Senior Guide</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 🌊 Hydra Haven Rafting 🌊 | Gabriella Mujinga Ilunga</p>
        <nav class=" socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook Icon"></a>
            <a href="https://instagram.com"><img src="images/instagram.png"
                  alt="Instagram Icon"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.png" alt="Linkedin Icon"></a>
        </nav>
    </footer>
</body>

</html>
